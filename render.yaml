services:
  - type: web
    name: telegram-media-downloader
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: WEB_USERNAME
        value: admin
      - key: WEB_PASSWORD
        sync: false
